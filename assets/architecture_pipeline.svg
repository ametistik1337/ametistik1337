  <rect x="24" y="14" width="6" height="6" rx="1.5" fill="#3E3D32"/>
  <rect x="34" y="14" width="6" height="6" rx="1.5" fill="#3E3D32"/>
  <text x="50" y="20" class="mono lbl">ametist1337@driftwm: ~ [stack:architecture_topology]</text>
  <text x="446" y="20" class="mono tag" fill="#A6E22E" text-anchor="end">[topology: active]</text>
  <line x1="0" y1="30" x2="470" y2="30" stroke="#3E3D32" stroke-width="1"/>

  <!-- bus:systems -->
