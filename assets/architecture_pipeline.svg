<svg xmlns="http://www.w3.org/2000/svg" width="470" height="236" viewBox="0 0 470 236" fill="none">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, ui-monospace, monospace; }
      .lbl { font-size: 10px; fill: #75715E; letter-spacing: 0.5px; }
      .bus-lbl { font-size: 9.5px; font-weight: 700; letter-spacing: 0.5px; }
      .node-txt { font-size: 10.5px; font-weight: 600; }
      .arrow-tag { font-size: 8.5px; font-weight: 500; }
      .tag { font-size: 9.5px; font-weight: 600; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="469" height="235" rx="8" fill="#272822" stroke="#3E3D32" stroke-width="1"/>

  <!-- Titlebar -->
