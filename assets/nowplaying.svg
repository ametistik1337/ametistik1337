<svg xmlns="http://www.w3.org/2000/svg" width="470" height="118" viewBox="0 0 470 118" fill="none">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, ui-monospace, monospace; }
      .lbl { font-size: 10px; fill: #75715E; letter-spacing: 0.5px; }
      .title { font-size: 13.5px; font-weight: 700; fill: #F8F8F2; }
      .sub { font-size: 11px; fill: #E6DB74; }
      .meta { font-size: 10px; fill: #75715E; }
      .tag { font-size: 9.5px; font-weight: 600; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="0.5" y="0.5" width="469" height="117" rx="8" fill="#272822" stroke="#3E3D32" stroke-width="1"/>

  <!-- Titlebar -->
  <rect x="14" y="12" width="6" height="6" rx="1.5" fill="#3E3D32"/>
  <rect x="24" y="12" width="6" height="6" rx="1.5" fill="#3E3D32"/>
  <rect x="34" y="12" width="6" height="6" rx="1.5" fill="#3E3D32"/>
  <text x="50" y="18" class="mono lbl">ametistik1337@driftwm: ~ [media:spotify_sync]</text>
  <text x="446" y="18" class="mono tag" fill="#E6DB74" text-anchor="end">[status: paused]</text>
  <line x1="0" y1="26" x2="470" y2="26" stroke="#3E3D32" stroke-width="1"/>

  <!-- Inner Media Card -->
