        <rect x="0" y="0" width="48" height="48" rx="6"/>
      </clipPath>
      <image x="0" y="0" width="48" height="48" href="data:image/jpeg;base64," clip-path="url(#album-cover-clip)" preserveAspectRatio="xMidYMid slice"/>
      <rect x="0.5" y="0.5" width="47" height="47" rx="6" fill="none" stroke="#3E3D32" stroke-width="1"/>
      <!-- Official Spotify Corner Badge -->
      <g transform="translate(32, 32)">
        <circle cx="8" cy="8" r="8" fill="#1E1F1C"/>
        <path fill="#1DB954" transform="scale(0.55) translate(2.5, 2.5)" d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.502 17.306c-.218.358-.684.472-1.042.254-2.86-1.748-6.46-2.144-10.702-1.176-.41.094-.816-.164-.91-.572-.093-.41.164-.816.573-.91 4.646-1.06 8.618-.614 11.827 1.362.358.218.472.684.254 1.042zm1.47-3.268c-.274.446-.86.588-1.306.314-3.274-2.012-8.264-2.596-12.138-1.42-.504.154-1.036-.134-1.19-.638-.153-.504.135-1.036.638-1.19 4.43-1.344 9.924-.7 13.682 1.628.446.274.588.86.314 1.306zm.126-3.41c-3.926-2.332-10.4-2.548-14.156-1.408-.602.182-1.242-.162-1.424-.764-.182-.602.162-1.242.764-1.424 4.316-1.31 11.458-1.06 15.986 1.628.542.322.72 1.02.398 1.562-.322.542-1.02.72-1.562.398z"/>
