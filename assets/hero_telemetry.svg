<svg xmlns="http://www.w3.org/2000/svg" width="490" height="480" viewBox="0 0 490 480" fill="none">
  <defs>
    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, ui-monospace, monospace;
      }
      .lbl { font-size: 10px; fill: #75715E; letter-spacing: 0.5px; }
      .title { font-size: 20px; font-weight: 700; fill: #F8F8F2; }
      .role { font-size: 12px; fill: #66D9EF; font-weight: 500; }
      .node-hdr { font-size: 11px; font-weight: 700; }
      .spec-text { font-size: 11px; fill: #F8F8F2; }
      .spec-dim { font-size: 11px; fill: #75715E; }
      .spec-val { font-size: 11px; fill: #E6DB74; }
      .tag { font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <!-- Window Container with Hyprland Active Border -->
  <rect x="0.5" y="0.5" width="489" height="479" rx="8" fill="#272822" stroke="#F92672" stroke-width="1"/>

  <!-- Hyprland Titlebar -->
  <rect x="14" y="14" width="6" height="6" rx="1.5" fill="#F92672"/>
  <rect x="24" y="14" width="6" height="6" rx="1.5" fill="#E6DB74"/>
  <rect x="34" y="14" width="6" height="6" rx="1.5" fill="#A6E22E"/>
  <text x="50" y="20" class="mono lbl">ametist1337@driftwm: ~ [master:1]</text>
  <text x="440" y="20" class="mono tag" fill="#A6E22E" text-anchor="end">[online]</text>
  <line x1="0" y1="30" x2="490" y2="30" stroke="#3E3D32" stroke-width="1"/>

  <!-- ID Card Section -->
  <rect x="14" y="42" width="462" height="96" rx="6" fill="#1E1F1C" stroke="#3E3D32" stroke-width="1"/>
  <text x="26" y="60" class="mono lbl">ID_MANIFEST</text>
  <text x="26" y="86" class="mono title">ametist1337</text>
  <text x="26" y="106" class="mono role">systems &amp; android internals engineer</text>
  <text x="26" y="125" class="mono tag" fill="#A6E22E">arch: x86_64 / aarch64</text>
  <text x="175" y="125" class="mono tag" fill="#75715E">·</text>
  <text x="188" y="125" class="mono tag" fill="#66D9EF">env: wayland / linux / android</text>

  <!-- Node 1: Workstation -->
  <rect x="14" y="150" width="462" height="154" rx="6" fill="#1E1F1C" stroke="#3E3D32" stroke-width="1"/>
  <text x="26" y="172" class="mono node-hdr" fill="#A6E22E">node:workstation</text>
  <text x="464" y="172" class="mono tag" fill="#75715E" text-anchor="end">[host / primary]</text>
  
  <text x="26" y="196" class="mono spec-dim">cpu:</text>
  <text x="68" y="196" class="mono spec-text">amd ryzen 7 5700x (8c/16t, 4.67 ghz)</text>

  <text x="26" y="217" class="mono spec-dim">ram:</text>
  <text x="68" y="217" class="mono spec-text">16 gb ddr4-3200 · zram 15.5 gb swap</text>

  <text x="26" y="238" class="mono spec-dim">gpu:</text>
  <text x="68" y="238" class="mono spec-text">nvidia geforce gtx 1050 ti 4gb</text>

  <text x="26" y="259" class="mono spec-dim">os: </text>
  <text x="68" y="259" class="mono spec-val">cachyos linux x86_64 [kernel 7.3-bore]</text>

  <text x="26" y="280" class="mono spec-dim">wm: </text>
  <text x="68" y="280" class="mono" fill="#66D9EF" font-size="11px">driftwm [wayland infinite canvas]</text>

  <!-- Node 2: Mobile Dev -->
  <rect x="14" y="316" width="462" height="148" rx="6" fill="#1E1F1C" stroke="#3E3D32" stroke-width="1"/>
  <text x="26" y="338" class="mono node-hdr" fill="#66D9EF">node:mobile_dev</text>
  <text x="464" y="338" class="mono tag" fill="#75715E" text-anchor="end">[target: tegu]</text>

  <text x="26" y="364" class="mono spec-dim">dev: </text>
  <text x="68" y="364" class="mono spec-text">google pixel 9a [android 16 / v15]</text>

  <text x="26" y="388" class="mono spec-dim">root:</text>
  <text x="68" y="388" class="mono" fill="#FD971F" font-size="11px">kernelsu · lsposed · su root-shell</text>

  <text x="26" y="412" class="mono spec-dim">link:</text>
  <text x="68" y="412" class="mono spec-text">wireless adb [pairing active · tcp:5555]</text>

  <text x="26" y="436" class="mono spec-dim">arch:</text>
  <text x="68" y="436" class="mono spec-val">aarch64 / arm64-v8a</text>
</svg>